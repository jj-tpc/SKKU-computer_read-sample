<!doctype html>
<!--
  시제품 — 원 버튼, 위성 버튼, 질문창, 생각 깊이 버튼, 강아지 말풍선 (버려도 되는 코드, 제품에 들어가지 않는다).
  계획: 전체 화면 슬라이드 쇼 위에서 네 가지 안(A 궤도 / B 물방울 / C 음파 링 / D 혼합)을 ?variant= 로 바꿔 본다.
  D는 발표자가 고른 조합이다: C의 음파 링을 코랄 그라데이션으로 칠하고, 위성 버튼과 질문창은 A를 따른다.
  D의 말풍선은 오션·코랄 컨셉으로 네 가지(파도/심해/산호/바다 유리)를 조작판에서 바꿔 본다. 발표자는 산호를 골랐다.
  스트림 보여 주기는 목소리가 읽기 시작한 낱말까지만 보여 준다(이어서: 세 줄을 넘으면 위로 밀림 / 문장마다: 문장이 바뀌면 비움).
  더블클릭해서 브라우저로 연다. 목소리 신호는 가짜로 만든다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원 버튼 시제품</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  body { background: #fff; color: #1d2330; }
  body.dark { background: #1f2430; color: #eef1f6; }

  /* 가짜 슬라이드 쇼 화면 */
  #slide { position: absolute; inset: 0; padding: 7vh 8vw; }
  #slide h1 { font-size: 5.2vh; margin: 0 0 4vh; }
  #slide ul { font-size: 3.2vh; line-height: 1.8; margin: 0; padding-left: 1.2em; }
  #slide .num { position: absolute; right: 3vw; top: 3vh; font-size: 2vh; opacity: .5; }

  #dog { position: fixed; left: 0; top: 0; pointer-events: none; image-rendering: pixelated; z-index: 5; }

  /* 강아지 말풍선 — 안마다 모양이 다르다 */
  #bubble { position: fixed; z-index: 6; pointer-events: none; display: none; max-width: 300px; }
  #bubble.v-A { background: #fff; color: #1d2330; border-radius: 16px; padding: 10px 14px; font-size: 15px; line-height: 1.5;
                box-shadow: 0 6px 18px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.06); }
  #bubble.v-A::after { content: ""; position: absolute; left: 22px; bottom: -9px; border: 9px solid transparent; border-top-color: #fff; border-bottom: 0; }
  #bubble.v-A p { margin: 0; transition: opacity .4s; }
  #bubble.v-A p.old { opacity: .45; }
  #bubble.v-B { background: rgba(17,24,39,.88); color: #fff; border-radius: 12px; padding: 10px 16px; font-size: 18px; line-height: 1.45; max-width: 360px; }
  #bubble.v-B::after { content: ""; position: absolute; left: 24px; bottom: -8px; border: 8px solid transparent; border-top-color: rgba(17,24,39,.88); border-bottom: 0; }
  #bubble.v-C { background: #fff; color: #2a1a10; border: 3px solid #3A2216; box-shadow: 4px 4px 0 #3A2216; padding: 8px 12px 6px; font-size: 15px; line-height: 1.5; font-weight: 600; }
  #bubble.v-C::after { content: ""; position: absolute; left: 20px; bottom: -12px; width: 12px; height: 12px; background: #fff;
                       border-right: 3px solid #3A2216; border-bottom: 3px solid #3A2216; transform: skewX(-25deg); }
  #bubble.v-C .page { display: block; text-align: right; font-size: 11px; opacity: .6; margin-top: 2px; }

  /* 원 버튼 묶음 */
  #ui { position: fixed; right: 0; bottom: 0; width: 0; height: 0; z-index: 10; }
  .orb { position: fixed; cursor: pointer; }
  .orb canvas { position: absolute; pointer-events: none; }
  .sat { position: fixed; border: 0; cursor: pointer; font: inherit; user-select: none;
         transition: left .3s cubic-bezier(.2,.9,.3,1.3), top .3s cubic-bezier(.2,.9,.3,1.3), bottom .3s cubic-bezier(.2,.9,.3,1.2), opacity .2s; }
  .sat.hidden { opacity: 0; pointer-events: none; }
  .tip { position: absolute; left: 50%; top: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap; font-size: 12px;
         background: rgba(17,24,39,.85); color: #fff; padding: 2px 7px; border-radius: 6px; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .sat:hover .tip { opacity: 1; }

  /* A 궤도: 동그란 위성이 부채꼴로 */
  .sat.A { width: 46px; height: 46px; border-radius: 50%; background: #fff; color: #2F6FED; font-size: 17px; font-weight: 700;
           box-shadow: 0 4px 12px rgba(0,0,0,.18), 0 0 0 1px rgba(47,111,237,.25); }
  .sat.A:hover { background: #EEF3FF; }
  /* B 물방울: 글자가 있는 알약이 위로 쌓임 */
  .sat.B { height: 40px; padding: 0 16px 0 12px; border-radius: 999px; background: rgba(255,255,255,.96); color: #1d2a4a; font-size: 14px; font-weight: 600;
           box-shadow: 0 4px 14px rgba(0,0,0,.18); display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  .sat.B .ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg,#22D3EE,#3B82F6); color: #fff; font-size: 12px; }
  .sat.B:hover { background: #fff; }
  /* C 음파 링: 원 둘레의 부채 조각 (SVG) */
  #pie { position: fixed; z-index: 9; pointer-events: none; transition: opacity .2s, transform .28s cubic-bezier(.2,.9,.3,1.2); }
  #pie.hidden { opacity: 0; transform: scale(.6); }
  #pie.hidden path { pointer-events: none; }
  #pie path { pointer-events: auto; cursor: pointer; fill: rgba(15,27,61,.92); stroke: #3B82F6; stroke-width: 1.5; }
  #pie path:hover { fill: #1E3A8A; }
  #pie text { fill: #E0ECFF; font-size: 12px; font-weight: 600; pointer-events: none; }

  /* 질문창 */
  .ask { position: fixed; z-index: 11; transition: opacity .2s, transform .25s cubic-bezier(.2,.9,.3,1.1); }
  .ask.hidden { opacity: 0; pointer-events: none; transform: translateX(24px); }
  .ask input, .ask textarea { font: inherit; border: 0; outline: 0; background: transparent; color: inherit; resize: none; }
  .ask.A { height: 48px; width: 360px; border-radius: 999px; background: #fff; color: #1d2330; display: flex; align-items: center; padding: 0 6px 0 18px;
           box-shadow: 0 6px 20px rgba(0,0,0,.2), 0 0 0 2px #2F6FED; }
  .ask.A input { flex: 1; font-size: 15px; }
  .ask.A .send { width: 36px; height: 36px; border-radius: 50%; border: 0; background: #2F6FED; color: #fff; font-size: 16px; cursor: pointer; }
  .ask.B { width: 380px; border-radius: 16px; background: #fff; color: #1d2330; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .ask.B header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .ask.B header button { border: 0; background: none; font-size: 16px; cursor: pointer; color: #667085; }
  .ask.B textarea { width: 100%; font-size: 15px; line-height: 1.5; }
  .ask.B footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; color: #667085; }
  .ask.B .send { border: 0; border-radius: 999px; padding: 7px 16px; background: linear-gradient(135deg,#22D3EE,#3B82F6); color: #fff; font-weight: 700; cursor: pointer; }
  .ask.C { height: 56px; border-radius: 999px; background: #0F1B3D; color: #E0ECFF; display: flex; align-items: center; padding: 0 70px 0 22px;
           box-shadow: 0 6px 20px rgba(0,0,0,.3), inset 0 0 0 2px #3B82F6; transform-origin: right center; }
  .ask.C.hidden { transform: scaleX(.15); }
  .ask.C input { flex: 1; font-size: 15px; }
  .ask.C input::placeholder { color: #8FA8D8; }
  .ask.C .send { border: 0; background: none; color: #93C5FD; font-size: 18px; cursor: pointer; margin-right: 6px; }

  /* 생각 깊이 알약 */
  .effort { position: fixed; z-index: 12; height: 32px; padding: 0 12px; border-radius: 999px; border: 0; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700;
            display: flex; align-items: center; gap: 8px; transition: opacity .2s, transform .3s; box-shadow: 0 4px 12px rgba(0,0,0,.18); }
  .effort.hidden { opacity: 0; pointer-events: none; transform: translateY(8px); }
  .effort .lv { display: inline-flex; gap: 3px; }
  .effort .lv i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .25; }
  .effort .lv i.on { opacity: 1; }
  .effort .val { display: inline-block; min-width: 30px; text-align: left; }
  .effort.spin .val { animation: swap .32s ease; }
  @keyframes swap { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); opacity: .2; } 100% { transform: rotateX(0); } }
  .effort.A { background: #fff; color: #2F6FED; box-shadow: 0 4px 12px rgba(0,0,0,.18), 0 0 0 1px rgba(47,111,237,.3); }
  .effort.B { background: linear-gradient(135deg,#22D3EE,#3B82F6); color: #fff; }
  .effort.C { background: #0F1B3D; color: #93C5FD; box-shadow: inset 0 0 0 2px #3B82F6, 0 4px 12px rgba(0,0,0,.25); }

  /* D 혼합: A 모양의 위성 버튼, 질문창, 생각 깊이 알약을 코랄로 칠한다 */
  .coral.sat.A { color: #F0565E; box-shadow: 0 4px 12px rgba(0,0,0,.18), 0 0 0 1px rgba(255,111,97,.4); }
  .coral.sat.A:hover { background: #FFF1EE; }
  .coral.ask.A { box-shadow: 0 6px 20px rgba(0,0,0,.2), 0 0 0 2px #FF6F61; }
  .coral.ask.A .send { background: linear-gradient(135deg, #FF9E6D, #FF6F61 55%, #E8466E); }
  .coral.effort.A { color: #F0565E; box-shadow: 0 4px 12px rgba(0,0,0,.18), 0 0 0 1px rgba(255,111,97,.45); }
  .coral .tip { background: rgba(11,58,83,.94); font-size: 13px; padding: 3px 9px; }

  /* D안 말풍선: 오션·코랄. 바다색 #0B3A53 #0E6BA8 #2BB3C0, 산호색 #FF9E6D #FF6F61 #E8466E */
  #obubble { position: fixed; z-index: 6; pointer-events: none; max-width: 320px; opacity: 0; transform: translateY(10px) scale(.94);
             transform-origin: 30px 100%; transition: opacity .25s, transform .4s cubic-bezier(.2,.9,.3,1.3); }
  #obubble.show { opacity: 1; transform: none; }
  #obubble .float { position: relative; animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  #obubble .in { position: relative; overflow: hidden; padding: 11px 16px; font-size: 16px; line-height: 1.5; border-radius: 18px; word-break: keep-all; }
  /* 스트림: 너비를 고정해서 낱말이 붙을 때 말풍선이 옆으로 출렁이지 않게 한다. 세 줄이 넘으면 위로 밀어 올리고 맨 윗줄을 흐린다. */
  #obubble.stream .in { width: 300px; }
  #obubble .cap { max-height: 72px; overflow: hidden; }
  #obubble .cap.over { -webkit-mask-image: linear-gradient(transparent, #000 45%); mask-image: linear-gradient(transparent, #000 45%); }
  #obubble .track { transition: transform .3s ease-out; }
  #obubble .track span { display: inline-block; }
  #obubble .track .w-new { animation: wordin .28s ease-out; }
  @keyframes wordin { from { opacity: 0; transform: translateY(4px); filter: blur(2px); } }
  #obubble p { margin: 0; }
  #obubble p.new { animation: rise .35s ease-out; }
  #obubble p.old { opacity: .5; font-size: 14px; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  #obubble .dots { display: flex; gap: 5px; justify-content: flex-end; margin-top: 6px; }
  #obubble .dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .25; }
  #obubble .dots i.on { opacity: 1; background: #FF6F61; }
  #obubble .tail { position: absolute; left: 24px; top: 100%; }
  #obubble .tail::before { content: ""; position: absolute; left: 0; top: -1px; border: 9px solid transparent; border-bottom: 0; border-top-color: var(--tail); }
  #obubble .tail i { display: none; }
  /* 파도: 흰 카드 아래로 바닷물이 출렁인다. 물결 높이가 목소리를 따른다. */
  #obubble.ob-wave { --tail: #0E6BA8; }
  #obubble.ob-wave .in { background: #fff; color: #0B3A53; padding-bottom: 22px; box-shadow: 0 8px 22px rgba(11,58,83,.2), 0 0 0 1px rgba(14,107,168,.14); }
  #obubble.ob-wave .wavebox { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; transform-origin: bottom;
                      transform: scaleY(calc(.45 + var(--lv, 0) * 1.3)); }
  #obubble.ob-wave .wavebox svg { display: block; animation: drift 2.4s linear infinite; }
  @keyframes drift { to { transform: translateX(-40px); } }
  /* 심해: 깊은 바다색 카드에 산호빛 테두리, 안에서 기포가 올라가고 꼬리는 기포 세 개 */
  #obubble.ob-deep .in { background: linear-gradient(160deg, #0E5E84, #0B3A53 70%); color: #EAF8FB;
                 box-shadow: 0 8px 24px rgba(6,40,61,.35), inset 0 0 0 1.5px rgba(255,111,97,.8); }
  #obubble.ob-deep .tail::before { display: none; }
  #obubble.ob-deep .tail i { display: block; position: absolute; border-radius: 50%; background: #0B3A53; box-shadow: inset 0 0 0 1.5px rgba(255,111,97,.8); }
  #obubble.ob-deep .tail i:nth-child(1) { width: 12px; height: 12px; left: 0; top: 5px; }
  #obubble.ob-deep .tail i:nth-child(2) { width: 8px; height: 8px; left: 9px; top: 20px; }
  #obubble.ob-deep .tail i:nth-child(3) { width: 5px; height: 5px; left: 15px; top: 31px; }
  #obubble.ob-deep .air i { position: absolute; bottom: -8px; width: 6px; height: 6px; border-radius: 50%; border: 1px solid rgba(234,248,251,.65); animation: up 3.6s linear infinite; }
  #obubble.ob-deep .air i:nth-child(1) { left: 14%; }
  #obubble.ob-deep .air i:nth-child(2) { left: 58%; width: 4px; height: 4px; animation-delay: 1.2s; }
  #obubble.ob-deep .air i:nth-child(3) { left: 86%; animation-delay: 2.4s; }
  @keyframes up { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-90px); opacity: 0; } }
  /* 산호: 산호빛 그라데이션, 모서리가 조금씩 다른 둥근 돌 모양, 그림자는 바다색 */
  #obubble.ob-coral { --tail: #F2545B; }
  #obubble.ob-coral .in { background: linear-gradient(135deg, #FF7A59, #F2545B 55%, #D93D6A); color: #fff; font-weight: 600;
                  border-radius: 26px 20px 24px 14px / 20px 26px 18px 22px; box-shadow: 0 10px 24px rgba(14,107,168,.3); }
  #obubble.ob-coral p.old { opacity: .7; }
  #obubble.ob-coral .dots i.on { background: #fff; }
  /* 바다 유리: 물빛 반투명 유리에 산호빛 세로줄 */
  #obubble.ob-glass { --tail: rgba(214,243,246,.92); }
  #obubble.ob-glass .in { background: rgba(214,243,246,.8); -webkit-backdrop-filter: blur(12px) saturate(160%); backdrop-filter: blur(12px) saturate(160%);
                  color: #0B3A53; border: 1px solid rgba(255,255,255,.85); box-shadow: 0 8px 24px rgba(14,107,168,.25); padding-left: 22px; }
  #obubble.ob-glass .in::before { content: ""; position: absolute; left: 9px; top: 12px; bottom: 12px; width: 4px; border-radius: 4px; background: linear-gradient(#FF9E6D, #E8466E); }

  #toast { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); background: rgba(17,24,39,.9); color: #fff; padding: 8px 14px; border-radius: 8px;
           font-size: 14px; z-index: 40; opacity: 0; transition: opacity .2s; pointer-events: none; }

  /* 시제품 조작판 — 평가 대상 화면이 아님 */
  #panel { position: fixed; left: 12px; top: 12px; z-index: 30; background: rgba(17,24,39,.92); color: #fff; border-radius: 10px; padding: 10px 12px; font-size: 12px; width: 300px; }
  #panel h4 { margin: 0 0 6px; font-size: 12px; display: flex; justify-content: space-between; }
  #panel h4 button { background: none; border: 0; color: #9CA3AF; cursor: pointer; }
  #panel .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 6px 0; }
  #panel .row b { width: 64px; font-weight: 600; color: #9CA3AF; }
  #panel .row button { background: #374151; color: #fff; border: 0; border-radius: 6px; padding: 3px 7px; cursor: pointer; font: inherit; }
  #panel .row button.on { background: #2F6FED; }
  #panel .now { color: #9CA3AF; margin-top: 4px; }
  #panel.min .body { display: none; }
  #switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; background: #111827; color: #fff;
              border-radius: 999px; padding: 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,.3); font-size: 14px; z-index: 30; }
  #switcher button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: #374151; color: #fff; cursor: pointer; }
  #switcher .label { min-width: 190px; text-align: center; font-weight: 600; }
</style>
</head>
<body>
<div id="slide">
  <span class="num">2 / 6</span>
  <h1>인공지능이란?</h1>
  <ul>
    <li>사람처럼 배우고 판단하는 컴퓨터 프로그램</li>
    <li>데이터에서 규칙을 스스로 찾아냄</li>
    <li>번역, 음성 인식, 그림 그리기 등에 활용</li>
  </ul>
</div>
<canvas id="dog" width="128" height="128"></canvas>
<div id="bubble"></div>
<div id="obubble"><div class="float"><div class="in"></div><span class="tail"><i></i><i></i><i></i></span></div></div>
<div id="ui"></div>
<div id="toast"></div>

<div id="panel">
  <h4>시제품 조작 <button id="pmin">접기</button></h4>
  <div class="body">
    <div class="row"><b>상태</b>
      <button data-mode="idle">평상시</button><button data-mode="reading">읽는 중</button>
      <button data-mode="thinking">생각 중</button><button data-mode="speaking">말하는 중</button></div>
    <div class="row"><b>접힘 시간</b>
      <button data-col="2000">2초</button><button data-col="4000">4초</button><button data-col="6000">6초</button><button data-col="8000">8초</button></div>
    <div class="row" id="bubrow"><b>말풍선</b>
      <button data-obs="wave">파도</button><button data-obs="deep">심해</button><button data-obs="coral">산호</button><button data-obs="glass">바다 유리</button></div>
    <div class="row" id="bubrow2"><b>보여 주기</b>
      <button data-obm="stream">스트림·이어서</button><button data-obm="streamS">스트림·문장마다</button>
      <button data-obm="one">한 문장·3초</button><button data-obm="stack">쌓임·3초</button><button data-obm="page">쪽수·5초</button></div>
    <div class="row"><b>배경</b><button data-bg="light">흰 슬라이드</button><button data-bg="dark">어두운 슬라이드</button></div>
    <div class="now" id="now"></div>
    <div class="now">원 버튼을 눌러 위성 버튼을 펼치세요. [질문하기]로 질문을 보내면 생각 중 → 말하는 중으로 넘어갑니다.</div>
  </div>
</div>
<div id="switcher" aria-label="시제품 전환">
  <button id="prev" title="이전 (←)">◀</button><span class="label" id="swlabel"></span><button id="next" title="다음 (→)">▶</button>

    bubble.innerHTML = `${st.sentences[said - 1]}<span class="page">${said} / ${st.sentences.length}</span>`;
  }
  const bx = Math.max(8, Math.min(innerWidth - bubble.offsetWidth - 8, pos.x + 36));
  const by = Math.max(8, pos.y + 18 - bubble.offsetHeight);
  bubble.style.left = bx + "px"; bubble.style.top = by + "px";
}

// D안 말풍선: 오션·코랄. 문장이 바뀔 때만 내용을 새로 그려서 등장 움직임이 매 프레임 다시 시작되지 않게 한다.
const ob = document.getElementById("obubble"), obIn = ob.querySelector(".in");
const WAVE_PATH = "M0 7 q10 -7 20 0" + " t20 0".repeat(21) + " V14 H0 Z";
let obKey = "";
function drawOceanBubble(now) {
  const shown = (st.mode === "speaking" || now < st.bubbleUntil) && st.sentences.length > 0;
  const streaming = st.obMode === "stream" || st.obMode === "streamS";
  const cls = `ob-${st.obStyle}${streaming ? " stream" : ""}${shown ? " show" : ""}`;
  if (ob.className !== cls) ob.className = cls;
  if (!shown) { obKey = ""; obIn.dataset.k = ""; return; }
  const said = Math.min(st.sentences.length, st.cPage + 1);
  // 스트림: 목소리가 읽기 시작한 낱말까지만 보인다. 다 말한 뒤에는 전부 보인다.
  let nWords = ANSWER_WORDS.length;
  if (streaming && st.mode === "speaking" && st.utter) nWords = st.utter.wordT.filter(x => x <= now / 1000 - st.utter.start).length;
  const key = `${st.obStyle}|${st.obMode}|${streaming ? nWords : said}`;
  if (key !== obKey) {
    obKey = key;
    if (streaming) {
      const lastS = nWords ? ANSWER_WORDS[nWords - 1].si : 0;
      const from = st.obMode === "streamS" ? ANSWER_WORDS.findIndex(x => x.si === lastS) : 0;
      const k = `${st.obStyle}|${st.obMode}`;
      if (obIn.dataset.k !== k) { obIn.innerHTML = `<div class="cap"><div class="track"></div></div>` + oceanDecor(); obIn.dataset.k = k; }
      const cap = obIn.querySelector(".cap"), track = obIn.querySelector(".track");
      track.innerHTML = ANSWER_WORDS.slice(from, nWords)
        .map((x, i, arr) => `<span${i === arr.length - 1 && st.mode === "speaking" ? ' class="w-new"' : ""}>${x.w}</span>`).join(" ");
      const over = Math.max(0, track.offsetHeight - cap.clientHeight);
      const jump = obIn.dataset.from !== String(from);   // 문장마다: 새 문장이면 미끄러지지 않고 바로 맨 위로
      obIn.dataset.from = from;
      if (jump) track.style.transition = "none";
      track.style.transform = `translateY(${-over}px)`;
      if (jump) { void track.offsetHeight; track.style.transition = ""; }
      cap.classList.toggle("over", over > 0);
    } else {
      let html = st.obMode === "stack"
        ? st.sentences.slice(Math.max(0, said - 3), said).map((x, i, arr) => `<p class="${i < arr.length - 1 ? "old" : "new"}">${x}</p>`).join("")
        : `<p class="new">${st.sentences[said - 1]}</p>`;
      if (st.obMode === "page") html += `<div class="dots">${st.sentences.map((_, i) => `<i class="${i < said ? "on" : ""}"></i>`).join("")}</div>`;
      obIn.innerHTML = html + oceanDecor(); obIn.dataset.k = "";
    }
  }
  ob.style.setProperty("--lv", smooth.toFixed(3));
  const lift = st.obStyle === "deep" ? 18 : 0;   // 기포 꼬리가 길어서 그만큼 위로 올린다
  const bx = Math.max(8, Math.min(innerWidth - ob.offsetWidth - 8, pos.x + 36));
  const by = Math.max(8, pos.y + 18 - lift - ob.offsetHeight);
  ob.style.left = bx + "px"; ob.style.top = by + "px";
}
// 모양마다 붙는 장식: 파도는 물결 띠, 심해는 올라가는 기포.
function oceanDecor() {
  if (st.obStyle === "wave") return `<div class="wavebox"><svg viewBox="0 0 440 14" width="440" height="14"><defs><linearGradient id="wg" x1="0" x2="1">
      <stop offset="0" stop-color="#0E6BA8"/><stop offset="1" stop-color="#2BB3C0"/></linearGradient></defs><path d="${WAVE_PATH}" fill="url(#wg)"/></svg></div>`;
  if (st.obStyle === "deep") return `<span class="air"><i></i><i></i><i></i></span>`;
  return "";
}

// ---------------------------------------------------------------- 매 프레임
function loop(nowMs) {
  const now = nowMs / 1000;
  const v = voiceAt(st.utter, now);
  smooth += (v.lv - smooth) * 0.35; toneS += (v.tone - toneS) * 0.08;
  if (v.done && st.utter) {
    if (st.mode === "speaking") { st.bubbleUntil = nowMs + BUBBLE_HOLD[bubbleKind()]; setMode("idle"); }
    else if (st.mode === "reading") { st.utter = makeUtter(READ_TEXT, SPEEDS[st.speed], null); }
  }
  const S = VARIANTS[st.vk].canvas;
  octx.clearRect(0, 0, S, S);
  DRAW[st.vk](octx, S, now, st.mode, smooth, toneS);
  drawDog(nowMs, smooth);
  drawBubble(nowMs);
  document.getElementById("now").textContent =
    `지금: ${({ idle: "평상시", reading: "읽는 중", thinking: "생각 중", speaking: "말하는 중" })[st.mode]} · 배속 x${SPEEDS[st.speed]} · 생각 ${EFFORTS[st.effort]} · 목소리 ${smooth.toFixed(2)}`
    + (st.expanded && hovering ? " · 접힘 멈춤(마우스 올림)" : "");
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------- 조작판, 전환 막대
document.querySelectorAll("#panel [data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll("#panel [data-col]").forEach(b => b.onclick = () => {
  st.collapseMs = +b.dataset.col; document.querySelectorAll("#panel [data-col]").forEach(x => x.classList.toggle("on", x === b));
});
document.querySelectorAll("#panel [data-bg]").forEach(b => b.onclick = () => {
  document.body.classList.toggle("dark", b.dataset.bg === "dark"); document.querySelectorAll("#panel [data-bg]").forEach(x => x.classList.toggle("on", x === b));
});
document.getElementById("pmin").onclick = () => { const p = document.getElementById("panel"); p.classList.toggle("min"); document.getElementById("pmin").textContent = p.classList.contains("min") ? "펴기" : "접기"; };
for (const [attr, field] of [["obs", "obStyle"], ["obm", "obMode"]]) {
  document.querySelectorAll(`#panel [data-${attr}]`).forEach(b => b.onclick = () => {
    st[field] = b.dataset[attr]; document.querySelectorAll(`#panel [data-${attr}]`).forEach(x => x.classList.toggle("on", x === b));
    if (st.mode !== "speaking") setMode("speaking");
  });
  document.querySelector(`#panel [data-${attr}="${st[field]}"]`).classList.add("on");
}
document.querySelector('#panel [data-col="4000"]').classList.add("on");
document.querySelector('#panel [data-bg="light"]').classList.add("on");

function go(d) {
  const pie = document.getElementById("pie"); if (pie) pie.remove();
  st.vk = KEYS[(KEYS.indexOf(st.vk) + d + KEYS.length) % KEYS.length];
  const url = new URL(location.href); url.searchParams.set("variant", st.vk); history.replaceState(null, "", url);
  build();
}
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
  if (e.key === "Escape") { collapse(); closeAsk(); }
});
addEventListener("resize", () => { const pie = document.getElementById("pie"); if (pie) pie.remove(); build(); });
// 처음 상태를 주소로 지정할 수 있다: ?mode=speaking&open=1&ask=1&ob=coral&obm=stream
const Q = new URLSearchParams(location.search);
setMode(["idle", "reading", "thinking", "speaking"].includes(Q.get("mode")) ? Q.get("mode") : "idle");
dogImg.decode().then(() => {
  build();
  if (Q.get("open") === "1") expand();
  if (Q.get("ask") === "1") openAsk(true);
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
