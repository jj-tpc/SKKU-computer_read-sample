<!doctype html>
<!--
  시제품 — 설정 창(대본 화면 포함) (버려도 되는 코드, 제품에 들어가지 않는다).
  계획: 세 가지 안을 ?variant=A|B|C 로 바꿔 본다. 저장은 하지 않고 모든 상태는 메모리에만 있다.
  발표자는 B를 골랐다. 그 뒤 파일과 대본을 설정 창에서 빼서, 원 버튼의 폴더 위성 버튼으로 여는 '발표 자료 창'으로 옮겼다(B만).
    A 사이드 탭: 왼쪽 탭 + 오른쪽 양식, 적용·취소(지금 앱과 같은 방식). 대본은 탭 하나.
    B 준비 체크리스트: 한 장을 위에서 아래로 훑는 준비 순서. 바꾸면 바로 저장. 대본은 따로 뜨는 큰 창.
    C 대본 작업대: 대본 고치기가 주인공. 설정은 오른쪽에서 꺼내는 서랍. 바꾸면 바로 저장.
  더블클릭해서 브라우저로 연다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설정 창 시제품</title>
<style>
  :root {
    --ocean-900: #06283D; --ocean-800: #0B3A53; --ocean-700: #0E5E84; --ocean-600: #0E6BA8; --aqua: #2BB3C0;
    --foam: #E6F7F8; --foam-2: #F3FBFC; --sand: #FFF7F1; --line: #D6E6EC; --muted: #5B7A8C; --ink: #0B3A53;
    --coral: #FF6F61; --coral-d: #E8466E; --coral-l: #FF9E6D; --ok: #1E9E74; --bad: #E8466E;
    --coral-grad: linear-gradient(135deg, #FF9E6D, #FF6F61 55%, #E8466E);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; color: var(--ink); }
  body { background: #1d2733; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* 뒤 배경: 흐린 슬라이드 쇼 (창이 떠 있는 자리를 느끼게) */
  #backdrop { position: fixed; inset: 0; background: #fff; filter: blur(2px) brightness(.55); padding: 7vh 8vw; }
  #backdrop h1 { font-size: 5vh; margin: 0 0 3vh; } #backdrop li { font-size: 3vh; line-height: 1.8; }
  #orbhint { position: fixed; right: 28px; bottom: 28px; width: 56px; height: 56px; border-radius: 50%; background: var(--coral-grad);
             box-shadow: 0 0 0 3px rgba(255,255,255,.7), 0 0 24px rgba(255,111,97,.6); }

  /* 창 틀 (운영체제 창 흉내) */
  .win { position: fixed; left: 50%; top: 48%; transform: translate(-50%, -50%); background: #fff; border-radius: 12px; overflow: hidden;
         box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.2); display: flex; flex-direction: column; max-width: calc(100vw - 32px); max-height: calc(100vh - 110px); }
  .titlebar { height: 34px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 14px; font-size: 13px;
              background: #F4F7F9; border-bottom: 1px solid var(--line); color: #33505F; }
  .titlebar .x { width: 34px; height: 26px; border: 0; background: none; cursor: pointer; border-radius: 6px; }
  .titlebar .x:hover { background: #E8466E; color: #fff; }

  /* 공통 부품 */
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 7px 14px; cursor: pointer; }
  .btn:hover { background: var(--foam-2); }
  .btn.primary { border: 0; background: var(--coral-grad); color: #fff; font-weight: 700; box-shadow: 0 4px 12px rgba(232,70,110,.25); }
  .btn.primary:disabled { background: #E3E9EC; color: #9AB0BB; box-shadow: none; cursor: default; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--ocean-600); }
  .btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
  select, input[type=text], input[type=password], textarea { border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: #fff; outline: none; }
  select:focus, input:focus, textarea:focus { border-color: var(--aqua); box-shadow: 0 0 0 3px rgba(43,179,192,.18); }
  textarea { resize: none; line-height: 1.6; }
  .hint { font-size: 12px; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--foam); color: var(--ocean-700); white-space: nowrap; }
  .chip.ok { background: #E3F6EF; color: var(--ok); } .chip.bad { background: #FDE8EE; color: var(--bad); } .chip.warn { background: #FFF1E6; color: #C2601F; }
  .chip.off { background: #EEF2F4; color: #7C93A0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
  .toggle { position: relative; width: 42px; height: 24px; border-radius: 999px; background: #CFDCE2; border: 0; cursor: pointer; flex: none; transition: background .2s; }
  .toggle::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .2s; }
  .toggle.on { background: var(--coral-grad); } .toggle.on::after { left: 21px; }
  .seg { display: inline-flex; background: var(--foam); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; color: var(--ocean-700); }
  .seg button.on { background: #fff; color: var(--coral-d); font-weight: 700; box-shadow: 0 1px 4px rgba(11,58,83,.15); }
  .keyrow { display: flex; gap: 6px; align-items: center; }
  .keyrow input { flex: 1; min-width: 0; font-family: Consolas, monospace; font-size: 13px; }
  .keystate { font-size: 12px; white-space: nowrap; }
  .keystate.ok { color: var(--ok); } .keystate.bad { color: var(--bad); } .keystate.checking { color: var(--muted); }

  /* 강아지 고르기 카드 */
  .dogs { display: flex; gap: 10px; }
  .dog { border: 2px solid var(--line); border-radius: 14px; padding: 6px 10px 8px; cursor: pointer; background: #fff; text-align: center; width: 112px; }
  .dog.on { border-color: var(--coral); background: var(--sand); box-shadow: 0 4px 14px rgba(255,111,97,.2); }
  .dog .spr { width: 96px; height: 96px; margin: 0 auto; image-rendering: pixelated; background-size: 384px 576px; background-position-y: -192px;
              animation: sit 1s steps(4) infinite; }
  @keyframes sit { from { background-position-x: 0; } to { background-position-x: -384px; } }
  .dog b { display: block; font-size: 13px; } .dog small { color: var(--muted); font-size: 11px; }

  /* 캡션 진행 막대 */
  .capbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: var(--foam-2); border: 1px solid var(--line); font-size: 13px; }
  .capbar .track { flex: 1; height: 6px; border-radius: 3px; background: #DCEBF0; overflow: hidden; }
  .capbar .fill { height: 100%; background: linear-gradient(90deg, var(--aqua), var(--ocean-600)); transition: width .4s; }
  .capbox { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--foam-2); font-size: 13px; }
  .capbox textarea { width: 100%; border: 0; background: transparent; padding: 2px 0 0; font-size: 13px; }
  .capbox .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  .capbox.skip { color: var(--muted); font-style: italic; }

  /* 시제품 조작판과 전환 막대 — 평가 대상 화면이 아님 */
  #panel { position: fixed; left: 12px; bottom: 12px; z-index: 50; background: rgba(17,24,39,.94); color: #fff; border-radius: 10px; padding: 10px 12px; font-size: 12px; width: 270px; }
  #panel h4 { margin: 0 0 6px; display: flex; justify-content: space-between; font-size: 12px; }
  #panel h4 button { background: none; border: 0; color: #9CA3AF; cursor: pointer; }
  #panel .row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin: 5px 0; }
  #panel .row b { width: 70px; color: #9CA3AF; font-weight: 600; }
  #panel .row button { background: #374151; color: #fff; border: 0; border-radius: 6px; padding: 3px 7px; cursor: pointer; }
  #panel .row button.on { background: #2F6FED; }
  #panel.min .body { display: none; }
  #switcher { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 10px; background: #111827; color: #fff;
              border-radius: 999px; padding: 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,.35); font-size: 14px; }
  #switcher button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: #374151; color: #fff; cursor: pointer; }
  #switcher .label { min-width: 230px; text-align: center; font-weight: 600; }
  #toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: var(--ocean-800); color: #fff; padding: 7px 14px; border-radius: 999px;
           font-size: 13px; z-index: 45; opacity: 0; transition: opacity .2s; pointer-events: none; }

  /* ---------------- A 사이드 탭 ---------------- */
  .A { width: 980px; height: 640px; }
  .A .body { flex: 1; display: flex; min-height: 0; }
  .A nav { width: 214px; flex: none; background: linear-gradient(180deg, var(--ocean-800), var(--ocean-900)); color: #CFE7EE; padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; }
  .A nav .brand { display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px; color: #fff; font-weight: 700; }
  .A nav .brand i { width: 22px; height: 22px; border-radius: 50%; background: var(--coral-grad); display: inline-block; box-shadow: 0 0 10px rgba(255,111,97,.6); }
  .A nav button { text-align: left; border: 0; background: none; color: inherit; padding: 9px 12px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; position: relative; }
  .A nav button:hover { background: rgba(255,255,255,.07); }
  .A nav button.on { background: rgba(255,111,97,.16); color: #fff; font-weight: 700; box-shadow: inset 3px 0 0 var(--coral); }
  .A nav button .need { position: absolute; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 3px rgba(255,111,97,.25); }
  .A nav .foot { margin-top: auto; padding: 10px 8px 2px; font-size: 12px; color: #8FB4C4; line-height: 1.6; }
  .A main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--foam-2); }
  .A .content { flex: 1; overflow: auto; padding: 22px 28px; }
  .A h2 { margin: 0 0 4px; font-size: 20px; } .A .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .A .group { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 4px 18px; margin-bottom: 14px; }
  .A .row { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid #EDF3F6; }
  .A .row:last-child { border-bottom: 0; }
  .A .row > label { font-weight: 600; font-size: 14px; }
  .A .row .ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .A footer { flex: none; display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: #fff; align-items: center; }
  .A footer .changed { margin-right: auto; font-size: 13px; color: #C2601F; }
  .A .banner { display: flex; gap: 14px; align-items: center; background: var(--sand); border: 1px solid #FFD9C7; border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; }
  .A .banner ol { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.7; }
  .A .script { display: grid; grid-template-columns: 230px 1fr; gap: 14px; height: 100%; min-height: 0; }
  .A .slist { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: auto; padding: 6px; }
  .A .slist button { width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  .A .slist button.on { background: var(--foam); }
  .A .slist .n { color: var(--muted); font-size: 12px; width: 18px; flex: none; }
  .A .slist .t { flex: 1; font-size: 14px; } .A .slist .bdg { font-size: 11px; color: var(--coral-d); }
  .A .editor { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .A .editor textarea { flex: 1; min-height: 150px; font-size: 15px; }

  /* ---------------- B 준비 체크리스트 ---------------- */
  .B { width: 720px; height: 680px; }
  .B .scroll { flex: 1; overflow: auto; background: linear-gradient(180deg, var(--foam) 0, #fff 220px); }
  .B .hero { display: flex; gap: 16px; align-items: center; padding: 20px 26px 10px; }
  .B .hero .spr { width: 96px; height: 96px; image-rendering: pixelated; background-size: 384px 576px; background-position-y: -192px; animation: sit 1s steps(4) infinite; flex: none; }
  .B .hero h2 { margin: 0 0 6px; font-size: 21px; }
  .B .meter { display: flex; gap: 6px; flex-wrap: wrap; }
  .B .bar { height: 8px; border-radius: 4px; background: #DCEBF0; margin: 10px 0 0; overflow: hidden; width: 320px; }
  .B .bar i { display: block; height: 100%; background: var(--coral-grad); transition: width .3s; }
  .B .card { margin: 12px 22px; background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 2px 10px rgba(11,58,83,.05); }
  .B .card > header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; cursor: pointer; }
  .B .card > header .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--foam); color: var(--ocean-700); flex: none; }
  .B .card.done > header .num { background: #E3F6EF; color: var(--ok); }
  .B .card.next > header .num { background: var(--coral-grad); color: #fff; }
  .B .card > header h3 { margin: 0; font-size: 16px; flex: 1; } .B .card > header .sum { font-size: 12px; color: var(--muted); }
  .B .card .inner { padding: 0 18px 14px 58px; display: flex; flex-direction: column; gap: 12px; }
  .B .card.closed .inner { display: none; }
  .B .field { display: flex; flex-direction: column; gap: 5px; } .B .field > span { font-size: 13px; font-weight: 600; }
  .B .line { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .B .next-tag { font-size: 11px; font-weight: 700; color: #fff; background: var(--coral-grad); padding: 2px 8px; border-radius: 999px; }
  .B2 { width: 1020px; height: 640px; z-index: 30; left: 44%; }   /* 원 버튼 위성 버튼이 가려지지 않게 조금 왼쪽으로 */
  .B2 .film { display: flex; gap: 10px; padding: 12px 16px; overflow-x: auto; background: var(--ocean-800); flex: none; }
  .B2 .film button { width: 150px; flex: none; height: 92px; border-radius: 10px; border: 2px solid transparent; background: #fff; text-align: left; padding: 8px; cursor: pointer; position: relative; font-size: 12px; }
  .B2 .film button.on { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(255,111,97,.35); }
  .B2 .film b { display: block; font-size: 12px; margin-bottom: 4px; } .B2 .film .n { position: absolute; right: 8px; bottom: 6px; color: var(--muted); }
  .B2 .film .bdg { position: absolute; left: 8px; bottom: 6px; color: var(--coral-d); }
  .B2 .work { flex: 1; display: grid; grid-template-columns: 1fr 320px; gap: 14px; padding: 14px 16px; min-height: 0; background: var(--foam-2); }
  .B2 .col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .B2 textarea.main { flex: 1; font-size: 15px; }

  .fsat { position: fixed; z-index: 20; width: 46px; height: 46px; border-radius: 50%; border: 0; background: #fff; color: #F0565E; font-size: 17px; font-weight: 700;
          cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.25), 0 0 0 1px rgba(255,111,97,.4); }
  .fsat.dim { opacity: .55; cursor: default; }
  .fsat.on { box-shadow: 0 0 0 3px var(--coral), 0 4px 14px rgba(0,0,0,.3); }
  .fsat .tip { position: absolute; right: calc(100% + 8px); top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: 12px; font-weight: 400;
               background: rgba(11,58,83,.94); color: #fff; padding: 3px 9px; border-radius: 6px; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .fsat:hover .tip, .fsat.on .tip { opacity: 1; }
  .B2 .fhead { flex: none; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; background: var(--sand); border-bottom: 1px solid #FFD9C7; }
  .B2 .fhead .sp { flex: 1; }
  .B2 .fhead label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  .B2 .fempty { flex: 1; display: grid; place-items: center; background: var(--foam-2); }
  .B2 .fempty .drop { border: 2px dashed #9CC9D6; border-radius: 20px; padding: 40px 70px; background: #fff; text-align: center; }
  .B .callout { margin: 6px 22px 0; padding: 10px 14px; border-radius: 12px; background: var(--sand); border: 1px solid #FFD9C7; display: flex; gap: 10px; align-items: center; font-size: 13px; }
  .B .chip.link { cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

  /* ---------------- C 대본 작업대 ---------------- */
  .C { width: 1060px; height: 660px; }
  .C .top { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: linear-gradient(90deg, var(--ocean-800), var(--ocean-700)); color: #fff; }
  .C .top .file { font-weight: 700; } .C .top .sp { flex: 1; }
  .C .top .chip { background: rgba(255,255,255,.12); color: #E6F7F8; } .C .top .chip.ok { background: rgba(30,158,116,.25); color: #B9F2DC; }
  .C .top .chip.bad { background: rgba(232,70,110,.3); color: #FFD0DB; } .C .top .chip.off { background: rgba(255,255,255,.08); color: #9FC0CE; }
  .C .top .gear { border: 0; border-radius: 10px; padding: 7px 12px; background: var(--coral-grad); color: #fff; font-weight: 700; cursor: pointer; }
  .C .top .tg { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  .C .stage { flex: 1; display: grid; grid-template-columns: 72px 1fr 300px; min-height: 0; position: relative; }
  .C .rail { background: #F1F6F8; border-right: 1px solid var(--line); overflow: auto; padding: 8px 6px; display: flex; flex-direction: column; gap: 6px; }
  .C .rail button { height: 52px; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; position: relative; font-weight: 700; color: var(--ocean-700); }
  .C .rail button.on { background: var(--coral-grad); color: #fff; border-color: transparent; }
  .C .rail button i { position: absolute; right: 4px; top: 3px; font-size: 10px; font-style: normal; }
  .C .center { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .C .seen { background: var(--ocean-800); color: #fff; border-radius: 14px; padding: 14px 18px; }
  .C .seen h3 { margin: 0 0 6px; } .C .seen p { margin: 0; white-space: pre-line; color: #CFE7EE; font-size: 14px; }
  .C .center textarea { flex: 1; font-size: 16px; }
  .C .side { border-left: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow: auto; background: var(--foam-2); }
  .C .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 400px; background: #fff; box-shadow: -12px 0 30px rgba(6,40,61,.2); transform: translateX(105%);
               transition: transform .28s cubic-bezier(.2,.9,.3,1); display: flex; flex-direction: column; z-index: 3; }
  .C .drawer.open { transform: none; }
  .C .dim { position: absolute; inset: 0; background: rgba(6,40,61,.25); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 2; }
  .C .dim.open { opacity: 1; pointer-events: auto; }
  .C .drawer header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .C .drawer header h3 { margin: 0; }
  .C .drawer .acc { overflow: auto; flex: 1; }
  .C .acc section { border-bottom: 1px solid var(--line); }
  .C .acc section > button { width: 100%; text-align: left; border: 0; background: none; padding: 13px 18px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; }
  .C .acc section.open > button { color: var(--coral-d); }
  .C .acc .in { padding: 0 18px 14px; display: none; flex-direction: column; gap: 10px; } .C .acc section.open .in { display: flex; }
  .C .acc .f { display: flex; flex-direction: column; gap: 4px; } .C .acc .f > span { font-size: 12px; font-weight: 600; color: var(--muted); }
  .C .acc .ln { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
  .C .empty { flex: 1; display: grid; place-items: center; text-align: center; }
  .C .drop { border: 2px dashed #9CC9D6; border-radius: 20px; padding: 40px 60px; background: var(--foam-2); }
  .C .drop h3 { margin: 10px 0 6px; }
</style>

    return `<div class="capbox"><div class="meta"><span>그림 ${i + 1} 캡션</span><span>${made ? (p.edited ? "✎ 고침" : "LLM이 만듦") : S.caption ? "기다리는 중" : "캡션 꺼짐"}</span></div>

const slideOf = () => SLIDES.find(s => s.n === S.slide);

// ---------------------------------------------------------------- A 사이드 탭
const A_TABS = [["deck", "📂", "발표 자료"], ["script", "📝", "대본"], ["voice", "🔊", "목소리"], ["qa", "💬", "질의응답"], ["char", "🐶", "캐릭터·화면"]];

const PICK = ["source", "voice", "output", "auto", "showRead", "provider", "model", "key", "persona", "caption", "dog", "dogVisible", "monitor", "link"];

const SATS = [["?", "질문하기"], ["▶", "읽기"], ["x1", "배속"], ["📂", "발표 자료 (파일·대본)", "files"], ["⚙", "설정", "settings"], ["✕", "끝내기"]];

    return `<button class="fsat ${win ? "" : "dim"} ${S.winB === win ? "on" : ""}" style="left:${x}px;top:${y}px" ${win ? `data-act="open${win}"` : ""}>${ic}<span class="tip">${tip}</span></button>`;

}

      <label>읽을 내용 <select data-input="source">${opt(SOURCES, S.source)}</select></label></div>

  app.innerHTML = ({ A: renderA, B: renderB, C: renderC })[S.vk]();
  document.querySelectorAll("#panel [data-first]").forEach(b => b.classList.toggle("on", (b.dataset.first === "1") === S.first));
  document.querySelectorAll("#panel [data-link]").forEach(b => b.classList.toggle("on", b.dataset.link === S.link));
}
function saved() { if (S.vk !== "A") toast("저장됨"); }
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.style.opacity = 1; clearTimeout(el._h); el._h = setTimeout(() => el.style.opacity = 0, 1200); }
function runCaptions(restart) {
  clearInterval(S.capTimer);
  if (restart) S.capDone = 0;
  if (!S.caption || !hasKey() || !S.file) return;
  S.capTimer = setInterval(() => { S.capDone++; if (S.capDone >= PICS.length) clearInterval(S.capTimer); render(); }, 900);
}

app.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle],[data-provider],[data-dog],[data-slide],[data-taba],[data-act],[data-cardb],[data-accc]");
  if (!t) return;
  const d = t.dataset;
  if (d.toggle) {
    if (d.toggle === "link") S.link = S.link === "off" ? "on" : "off";
    else S[d.toggle] = !S[d.toggle];
    if (d.toggle === "caption") runCaptions(true);
    saved();
  }
  if (d.provider) { S.provider = d.provider; S.model = PROVIDERS[d.provider].models[0]; S.key = ""; S.keyState = "none"; saved(); }
  if (d.dog) { S.dog = d.dog; saved(); }
  if (d.slide) S.slide = +d.slide;
  if (d.taba) S.tabA = d.taba;
  if (d.cardb) S.openB[d.cardb] = S.first ? "force" : !S.openB[d.cardb];
  if (d.accc) S.accC = S.accC === d.accc ? "" : d.accc;
  const a = d.act;
  if (a === "keyshow") S.keyShow = !S.keyShow;
  if (a === "keycheck") {
    S.keyState = "checking"; render();
    setTimeout(() => { S.keyState = S.key.startsWith(PROVIDERS[S.provider].prefix) && S.key.length > 8 ? "ok" : "bad"; runCaptions(false); render(); }, 900);
    return;
  }
  if (a === "reset") { delete slideOf().edited; }
  if (a === "openfile") { S.file = true; runCaptions(true); }
  if (a === "apply") { S.snap = JSON.stringify(pick(S)); toast("적용했어요"); }
  if (a === "cancel") { Object.assign(S, JSON.parse(S.snap)); toast("되돌렸어요"); }
  if (a === "capstop") clearInterval(S.capTimer);
  if (a === "caprestart") runCaptions(true);
  if (a === "openfiles") S.winB = "files";
  if (a === "opensettings") S.winB = "settings";
  if (a === "closewin") S.winB = "";
  if (a === "opendrawer") S.drawerC = true;
  if (a === "opendrawer-qa") { S.drawerC = true; S.accC = "qa"; }
  if (a === "closedrawer") S.drawerC = false;
  render();
});
// 글을 칠 때는 다시 그리지 않는다(입력 중 커서가 튀지 않게). 고른 값만 상태에 넣는다.
app.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (d.input === "key") { S.key = t.value; S.keyState = "none"; return; }
  if (d.input === "persona") { S.persona = t.value; return; }
  if (d.script) { slideOf().edited = t.value; return; }
  if (d.cap) { const [n, i] = d.cap.split(":").map(Number); const p = SLIDES.find(s => s.n === n).pics[i]; p.cap = t.value; p.edited = true; return; }
});
app.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (d.input && t.tagName === "SELECT") {
    if (d.input === "model" && t.value === "__custom") { const v = prompt("모델 ID를 입력하세요", S.model); if (v) S.model = v; }
    else S[d.input] = t.value;
    saved(); render();
  }
  if (d.input === "persona" || d.script || d.cap) { saved(); render(); }
});

document.querySelectorAll("#panel [data-first]").forEach(b => b.onclick = () => {
  S.first = b.dataset.first === "1";
  S.file = !S.first;
  if (S.first) { S.key = ""; S.keyState = "none"; S.tabA = "deck"; S.openB = { 2: false, 3: false, 4: false }; S.winB = "settings"; S.drawerC = false; clearInterval(S.capTimer); }
  else { S.key = "sk-ant-api03-••••••••••••••••"; S.keyState = "ok"; S.provider = "claude"; S.model = "claude-haiku-5-5"; S.openB = { 2: true, 3: false, 4: false }; runCaptions(false); }
  S.snap = JSON.stringify(pick(S)); render();
});
document.querySelectorAll("#panel [data-link]").forEach(b => b.onclick = () => { S.link = b.dataset.link; render(); });
document.getElementById("pmin").onclick = () => { const p = document.getElementById("panel"); p.classList.toggle("min"); document.getElementById("pmin").textContent = p.classList.contains("min") ? "펴기" : "접기"; };
function go(dir) {
  S.vk = KEYS[(KEYS.indexOf(S.vk) + dir + KEYS.length) % KEYS.length];
  const url = new URL(location.href); url.searchParams.set("variant", S.vk); history.replaceState(null, "", url);
  render();
}
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});
if (Q.get("first") === "1") { S.key = ""; S.keyState = "none"; S.openB = { 2: false, 3: false, 4: false }; }
if (Q.get("files") === "1") S.winB = "files";
addEventListener("resize", render);
if (Q.get("drawer") === "1") S.drawerC = true;
if (Q.get("tab")) S.tabA = Q.get("tab");
render();
</script>
</body>
</html>
